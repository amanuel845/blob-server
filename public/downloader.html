<!DOCTYPE html>
<html lang="en" class="h-full overflow-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI ZIP Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="h-full overflow-hidden flex flex-col bg-[#0d1a1f] text-[#e5e7eb] antialiased">

  <header class="flex-shrink-0 h-9 bg-[#0d1a1f] text-white shadow-[0_2px_10px_rgba(1,74,96,0.5)] flex items-center justify-between px-2 z-20 border-b border-[#1a3a42]">
    <div class="flex items-center gap-1.5">
      <i class="fa-solid fa-download text-[16px] text-cyan-400"></i>
      <span class="font-['Poppins',sans-serif] font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-white to-cyan-200 tracking-wide drop-shadow-[0_0_8px_rgba(6,182,212,0.5)] text-[15px]">AI ZIP Downloader</span>
    </div>
  </header>

  <main class="flex-1 overflow-hidden flex flex-col p-4 gap-1 relative bg-transparent min-h-0">
    <div class="flex flex-col items-center justify-center h-full w-full max-w-md mx-auto gap-4">
      
      <div class="bg-[#1a2e36] rounded-lg p-4 w-full shadow-xl border border-cyan-400/30">
        <p class="text-[10px] text-cyan-100/70 leading-relaxed">
          Reads the API key from localStorage. <br />
          <span id="key-status" class="text-[10px] text-red-400">Checking key...</span>
        </p>
      </div>

      <button id="downloadBtn" class="w-full bg-[#057c94] hover:bg-[#046a80] text-white px-4 py-2 rounded text-[12px] border border-cyan-600/30 transition-colors shadow-sm flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed">
        <i class="fa-solid fa-file-zipper"></i> Download ZIP
      </button>

      <div class="w-full bg-[#1a2e36] rounded-lg p-2 shadow-xl border border-cyan-400/30">
        <div class="flex justify-between items-center mb-1">
          <span id="status" class="text-[10px] text-cyan-200">Ready</span>
        </div>
        <div class="w-full bg-white/20 rounded-full h-1.5 overflow-hidden">
          <div id="progressBar" class="bg-cyan-400 h-1.5 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

    </div>
  </main>

  <script>
    // ✅ Read the key from localStorage (must be on the same origin)
    const STORAGE_KEY = 'blob-db-storage-key';
    const EXPORT_URL = 'https://blob-server.vercel.app/api/export-zip';

    function getApiKey() {
      return localStorage.getItem(STORAGE_KEY) || '';
    }

    // Update the status message based on whether the key exists
    const keyStatus = document.getElementById('key-status');
    const storedKey = getApiKey();

    if (storedKey) {
      keyStatus.textContent = '✅ API key found in localStorage.';
      keyStatus.className = 'text-[10px] text-green-400';
    } else {
      keyStatus.textContent = '❌ No key found. Unlock the main app first (or manually paste below).';
      keyStatus.className = 'text-[10px] text-red-400';
    }

    // Optional fallback: if no key, let user paste it manually (or you can remove this block)
    if (!storedKey) {
      const input = document.createElement('input');
      input.type = 'password';
      input.placeholder = 'Paste API key here';
      input.className = 'w-full bg-[#0d1a1f] border border-cyan-500/30 rounded px-2 py-1 text-[10px] text-cyan-200 font-mono focus:outline-none focus:border-cyan-400 mb-2';
      input.id = 'manual-key';
      document.querySelector('.bg-\\[\\#1a2e36\\]').appendChild(input);
    }

    const btn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');
    const progressBar = document.getElementById('progressBar');

    btn.addEventListener('click', async () => {
      // Get the key: from localStorage or from the manual input
      let apiKey = getApiKey();
      if (!apiKey) {
        const manualInput = document.getElementById('manual-key');
        apiKey = manualInput ? manualInput.value : '';
      }

      if (!apiKey) {
        status.textContent = '❌ No API key available.';
        return;
      }

      btn.disabled = true;
      status.textContent = 'Requesting ZIP from server...';
      progressBar.style.width = '30%';

      try {
        const response = await fetch(EXPORT_URL, {
          method: 'GET',
          headers: {
            'Authorization': 'Bearer ' + apiKey
          }
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error || 'Server error');
        }

        progressBar.style.width = '70%';
        const blob = await response.blob();
        
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ai-images.zip';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);

        progressBar.style.width = '100%';
        status.textContent = '✅ ZIP downloaded successfully!';
      } catch (err) {
        console.error(err);
        status.textContent = '❌ Error: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
