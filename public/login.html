<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Login · TikTok JSON Uploader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0d1a1f; font-family: 'DM Sans', sans-serif; }
    .login-box {
      background-color: #0d1a1f;
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 1rem;
      padding: 2rem;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }
    .login-box input:focus { border-color: #06b6d4; outline: none; box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.3); }
    .login-box .error { color: #f87171; font-size: 0.75rem; margin-top: 0.5rem; display: none; }
    .login-box .error.visible { display: block; }
  </style>
</head>
<body class="h-full flex items-center justify-center bg-[#0d1a1f] text-[#e5e7eb] antialiased">

  <div class="login-box text-center">
    <div class="text-5xl text-cyan-400 mb-3">
      <i class="fa-solid fa-lock"></i>
    </div>
    <h1 class="text-white text-lg font-semibold mb-1 tracking-wide">🔐 Unlock TikTok Uploader</h1>
    <p class="text-cyan-100/60 text-[10px] mb-4 max-w-[280px] mx-auto">Enter your password to decrypt your stored API key and access your database.</p>

    <form id="login-form">
      <input type="password" id="login-password" class="w-full bg-[#1a2e36] border border-cyan-500/40 rounded-lg px-3 py-2.5 text-white text-sm focus:border-cyan-400 transition-colors placeholder:text-white/30" placeholder="Enter password..." required autofocus />
      <div id="login-error" class="error">Invalid password. Please try again.</div>
      <button type="submit" id="login-btn" class="mt-3 w-full bg-cyan-600 hover:bg-cyan-700 text-white px-6 py-2.5 rounded-lg text-sm font-semibold shadow-md transition-colors flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed">
        <i class="fa-solid fa-key"></i> <span>Unlock</span>
      </button>
    </form>

    <p class="text-white/20 text-[7px] mt-4 tracking-wider">🔑 encrypted · secure</p>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/encryptor.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/helper.js"></script>

  <script>
    (function() {
      'use strict';

      const form = document.getElementById('login-form');
      const passwordInput = document.getElementById('login-password');
      const loginBtn = document.getElementById('login-btn');
      const errorEl = document.getElementById('login-error');

      // Check if already unlocked – redirect to index
      const storedKey = AuthModule.getStoredKey(AuthModule.config.storageKey);
      if (storedKey) {
        // Verify the key works by testing a simple request? Or just redirect.
        // We'll just redirect – if the key is invalid, the app will show unlock modal anyway.
        window.location.href = 'index.html';
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = passwordInput.value.trim();
        if (!password) return;

        loginBtn.disabled = true;
        loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Unlocking...';
        errorEl.classList.remove('visible');

        try {
          const apiKey = await AuthModule.unlockWithPassword(password);
          AuthModule.storeKey(AuthModule.config.storageKey, apiKey);
          // Redirect to main app
          window.location.href = 'index.html';
        } catch (err) {
          errorEl.textContent = err.message || 'Invalid password. Please try again.';
          errorEl.classList.add('visible');
          passwordInput.select();
        } finally {
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<i class="fa-solid fa-key"></i> Unlock';
        }
      });

      // Enter key triggers submit
      passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
      });

    })();
  </script>
</body>
</html>
