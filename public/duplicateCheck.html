<!DOCTYPE html>
<html lang="en" class="h-full overflow-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Date Duplicate Checker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="h-full overflow-hidden flex flex-col bg-[#0d1a1f] text-[#e5e7eb] antialiased">

  <header class="flex-shrink-0 h-9 bg-[#0d1a1f] text-white shadow-[0_2px_10px_rgba(1,74,96,0.5)] flex items-center justify-between px-2 z-20 border-b border-[#1a3a42]">
    <div class="flex items-center gap-1.5">
      <i class="fa-solid fa-database text-[16px] text-cyan-400"></i>
      <span class="font-['Poppins',sans-serif] font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-white to-cyan-200 tracking-wide drop-shadow-[0_0_8px_rgba(6,182,212,0.5)] text-[15px]">Date Duplicate Checker</span>
    </div>
  </header>

  <main class="flex-1 overflow-hidden flex flex-col p-2 gap-1 relative bg-transparent min-h-0">
    <div class="flex flex-col p-1 h-full overflow-hidden">
      
      <!-- Duplicate Check Section -->
      <div class="flex-shrink-0 bg-[#1a2e36] rounded-lg p-2 mb-1 shadow-xl border border-cyan-400/30 flex flex-col gap-2">
        <div class="flex items-center gap-2">
          <button id="check-duplicate-btn" class="bg-[#057c94] hover:bg-[#046a80] text-white px-4 py-1 rounded text-[10px] border border-cyan-600/30 transition-colors shadow-sm flex items-center gap-2">
            <i class="fa-solid fa-file-arrow-up"></i> Select File & Check Duplicate
          </button>
          <input type="file" id="file-input" class="hidden" />
        </div>

        <!-- Status Display -->
        <div id="duplicate-result" class="text-[10px] text-cyan-200"></div>
      </div>

      <!-- Category Filter -->
      <div class="flex-shrink-0 bg-[#1a2e36] rounded-lg p-2 mb-1 shadow-xl border border-cyan-400/30 flex items-center gap-2">
        <label class="text-[10px] text-cyan-300">Category:</label>
        <input type="text" id="category-filter" class="flex-1 bg-transparent border border-cyan-500/30 rounded px-2 py-1 text-[10px] text-cyan-200 font-mono focus:outline-none focus:border-cyan-400" value="uploads/image/selfies/" />
        <button id="check-btn" class="bg-[#057c94] hover:bg-[#046a80] text-white px-4 py-1 rounded text-[10px] border border-cyan-600/30 transition-colors shadow-sm"><i class="fa-solid fa-magnifying-glass mr-1"></i>Check</button>
      </div>

      <!-- Summary -->
      <div id="summary" class="flex-shrink-0 text-[10px] text-cyan-300 mb-1 px-2">
        <span id="total-count">0</span> files found | <span class="text-red-400" id="same-count">0</span> have SAME dates (Bug) | <span class="text-green-400" id="diff-count">0</span> have DIFFERENT dates (Fixed)
      </div>

      <!-- Results Table -->
      <div class="flex-1 overflow-auto bg-[#0d1a1f] rounded border border-white/10 p-1">
        <table class="w-full text-[9px] font-mono">
          <thead class="sticky top-0 bg-[#1a2e36] text-cyan-200 font-semibold">
            <tr>
              <th class="text-left p-1">File Name</th>
              <th class="text-center p-1" style="width: 60px;">UploadedAt</th>
              <th class="text-center p-1" style="width: 60px;">LastModified</th>
              <th class="text-center p-1" style="width: 40px;">Status</th>
            </tr>
          </thead>
          <tbody id="file-table-body"></tbody>
        </table>
      </div>

    </div>
  </main>

  <script>
    // --- Core Logic ---
    const tableBody = document.getElementById('file-table-body');
    const categoryInput = document.getElementById('category-filter');
    const totalSpan = document.getElementById('total-count');
    const sameSpan = document.getElementById('same-count');
    const diffSpan = document.getElementById('diff-count');
    const checkBtn = document.getElementById('check-btn');

    // Duplicate Checker Elements
    const duplicateResult = document.getElementById('duplicate-result');
    const fileInput = document.getElementById('file-input');
    const checkDuplicateBtn = document.getElementById('check-duplicate-btn');

    async function checkDates() {
      tableBody.innerHTML = '<tr><td colspan="4" class="text-center text-white/40 py-4">Loading...</td></tr>';
      
      try {
        const response = await fetch('./blobList.json');
        if (!response.ok) throw new Error('Failed to load blobList.json');
        const data = await response.json();
        
        const category = categoryInput.value.trim() || 'uploads/image/selfies/';
        const blobs = data.filter(b => b.pathname.startsWith(category));
        
        totalSpan.textContent = blobs.length;
        let sameCount = 0;
        let diffCount = 0;
        
        tableBody.innerHTML = '';
        
        blobs.forEach(blob => {
          const up = new Date(blob.uploadedAt);
          const mod = new Date(blob.lastModified);
          const isSame = up.getTime() === mod.getTime();
          
          if (isSame) {
            sameCount++;
          } else {
            diffCount++;
          }
          
          const name = blob.pathname.split('/').pop();
          const status = isSame 
            ? '<span class="text-red-400"><i class="fa-solid fa-circle-xmark"></i> SAME</span>' 
            : '<span class="text-green-400"><i class="fa-solid fa-circle-check"></i> FIXED</span>';
          
          const row = `
            <tr class="border-b border-white/5">
              <td class="text-left p-1 truncate" style="max-width: 150px;" title="${name}">${name}</td>
              <td class="text-center p-1 text-white/60">${blob.uploadedAt}</td>
              <td class="text-center p-1 text-white/60">${blob.lastModified}</td>
              <td class="text-center p-1">${status}</td>
            </tr>`;
          tableBody.innerHTML += row;
        });
        
        sameSpan.textContent = sameCount;
        diffSpan.textContent = diffCount;
        
        if (blobs.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="4" class="text-center text-white/40 py-4">No files found in this category</td></tr>';
        }
      } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="4" class="text-center text-red-400 py-4">Error: ${err.message}</td></tr>`;
      }
    }

    // Helper to extract YYYYMMDDHHMMSS from the file's original lastModified
    function getDateSuffix(timestamp) {
      const d = new Date(timestamp);
      return `${d.getUTCFullYear()}${String(d.getUTCMonth() + 1).padStart(2, '0')}${String(d.getUTCDate()).padStart(2, '0')}${String(d.getUTCHours()).padStart(2, '0')}${String(d.getUTCMinutes()).padStart(2, '0')}${String(d.getUTCSeconds()).padStart(2, '0')}`;
    }

    checkDuplicateBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      duplicateResult.innerHTML = `Size: ${file.size} bytes | Last Modified: ${new Date(file.lastModified).toLocaleString()}`;
      duplicateResult.className = 'text-[10px] text-yellow-400';

      try {
        // Check for duplicates based on the exact unique date suffix
        const dateSuffix = getDateSuffix(file.lastModified);
        const response = await fetch('./blobList.json');
        const data = await response.json();
        
        const duplicate = data.find(b => b.pathname.includes(`_${dateSuffix}.`));
        
        if (duplicate) {
          duplicateResult.innerHTML += `<br><span class="text-red-400">⚠️ DUPLICATE FOUND: ${duplicate.pathname}</span>`;
          duplicateResult.className = 'text-[10px] text-red-400';
        } else {
          duplicateResult.innerHTML += `<br><span class="text-green-400">✅ No duplicate found.</span>`;
          duplicateResult.className = 'text-[10px] text-green-400';
        }
      } catch (err) {
        duplicateResult.innerHTML = `❌ Error: ${err.message}`;
        duplicateResult.className = 'text-[10px] text-red-400';
      }
    });

    checkBtn.addEventListener('click', checkDates);
    categoryInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkDates();
    });
    
    // Auto check on load
    checkDates();
  </script>
</body>
</html>
