<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JS Obfuscator · TikTok JSON Uploader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *::-webkit-scrollbar { width: 0; height: 0; background: transparent; }
    * { scrollbar-width: none; -ms-overflow-style: none; }
    body { background-color: #0d1a1f; font-family: 'DM Sans', sans-serif; }
    textarea { font-family: 'Fira Code', monospace; }
    .code-area {
      background-color: #0d1a1f;
      border: 1px solid rgba(6, 182, 212, 0.2);
      border-radius: 0.375rem;
      padding: 0.5rem;
      width: 100%;
      height: 100%;
      resize: vertical;
      color: #e5e7eb;
      font-size: 0.75rem;
      line-height: 1.4;
      outline: none;
    }
    .code-area:focus { border-color: #06b6d4; }
    .option-group label { font-size: 0.7rem; color: #94a3b8; cursor: pointer; }
    .option-group input[type="checkbox"] { accent-color: #06b6d4; }
    .btn-obfuscate {
      background-color: #057c94;
      transition: all 0.2s;
    }
    .btn-obfuscate:hover { background-color: #046a80; transform: scale(1.02); }
    .btn-copy, .btn-download { background-color: #1a2e36; transition: all 0.2s; }
    .btn-copy:hover, .btn-download:hover { background-color: #2a3e46; transform: scale(1.02); }
  </style>
</head>
<body class="h-full overflow-hidden flex flex-col bg-[#0d1a1f] text-[#e5e7eb] antialiased">

  <header class="flex-shrink-0 h-9 bg-[#0d1a1f] text-white shadow-[0_2px_10px_rgba(1,74,96,0.5)] flex items-center justify-between px-2 z-20 border-b border-[#1a3a42]">
    <div class="flex items-center gap-1.5">
      <i class="fa-solid fa-bolt text-[16px] text-cyan-400"></i>
      <span class="font-['Poppins',sans-serif] font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-white to-cyan-200 tracking-wide drop-shadow-[0_0_8px_rgba(6,182,212,0.5)] text-[15px]">JS Obfuscator</span>
    </div>
    <div class="flex items-center gap-1.5">
      <a href="index.html" class="bg-cyan-800/50 hover:bg-cyan-700 text-white px-1.5 py-0.5 rounded border border-cyan-600/30 transition-colors text-[12px]">
        <i class="fa-solid fa-arrow-left w-3.5 text-center text-[14px]"></i> <span>App</span>
      </a>
    </div>
  </header>

  <main class="flex-1 overflow-hidden flex flex-col p-2 gap-1 relative bg-transparent min-h-0">
    <div class="bg-[#1a2e36] rounded-lg p-1 w-full flex-1 shadow-xl border border-cyan-400/30 overflow-hidden flex flex-col">

      <div class="flex-1 flex flex-col md:flex-row gap-1 min-h-0">
        <!-- Input panel -->
        <div class="flex-1 flex flex-col min-h-0">
          <div class="flex items-center justify-between px-1 py-0.5">
            <span class="text-[9px] text-cyan-300"><i class="fa-regular fa-file-code mr-1"></i> Input</span>
            <div class="flex gap-2">
              <span id="input-lines" class="text-[8px] text-white/40">0 lines</span>
              <span id="input-filename" class="text-[8px] text-white/30"></span>
            </div>
          </div>
          <div class="flex-1 bg-[#0d1a1f] rounded border border-white/10 overflow-hidden">
            <textarea id="input-code" class="code-area" placeholder="// Paste your JavaScript code here..."></textarea>
          </div>
        </div>

        <!-- Output panel -->
        <div class="flex-1 flex flex-col min-h-0">
          <div class="flex items-center justify-between px-1 py-0.5">
            <span class="text-[9px] text-cyan-300"><i class="fa-regular fa-file-code mr-1"></i> Output</span>
            <div class="flex gap-1">
              <button id="copy-output" class="btn-copy text-[8px] text-white/70 px-1.5 py-0.5 rounded border border-white/10 transition-colors"><i class="fa-regular fa-copy mr-0.5"></i> Copy</button>
              <button id="download-output" class="btn-download text-[8px] text-white/70 px-1.5 py-0.5 rounded border border-white/10 transition-colors"><i class="fa-solid fa-download mr-0.5"></i> Download</button>
              <span id="output-size" class="text-[8px] text-white/40">0 B</span>
            </div>
          </div>
          <div class="flex-1 bg-[#0d1a1f] rounded border border-white/10 overflow-hidden">
            <textarea id="output-code" class="code-area" readonly placeholder="Obfuscated code will appear here..."></textarea>
          </div>
        </div>
      </div>

      <!-- Options bar -->
      <div class="flex-shrink-0 flex flex-wrap items-center gap-2 px-1 py-1 mt-0.5 border-t border-white/5">
        <div class="flex items-center gap-2 option-group">
          <input type="checkbox" id="opt-rename" checked />
          <label for="opt-rename">Rename</label>
        </div>
        <div class="flex items-center gap-2 option-group">
          <input type="checkbox" id="opt-encode-strings" checked />
          <label for="opt-encode-strings">Encode Strings</label>
        </div>
        <div class="flex items-center gap-2 option-group">
          <input type="checkbox" id="opt-control-flow" />
          <label for="opt-control-flow">Flatten</label>
        </div>
        <div class="flex items-center gap-2 option-group">
          <input type="checkbox" id="opt-dead-code" />
          <label for="opt-dead-code">Dead Code</label>
        </div>
        <div class="flex-1"></div>
        <button id="obfuscate-btn" class="btn-obfuscate text-white text-[10px] px-3 py-1 rounded border border-cyan-600/30 transition-colors flex items-center gap-1">
          <i class="fa-solid fa-bolt"></i> Obfuscate
        </button>
        <button id="upload-btn" class="bg-white/10 hover:bg-white/20 text-white/80 px-2 py-1 rounded text-[10px] border border-white/10 transition-colors flex items-center gap-1">
          <i class="fa-regular fa-folder-open"></i> Upload JS
        </button>
        <input type="file" id="file-input" accept=".js,.ts,.json,.html,.css,.txt" style="display:none;" />
        <button id="clear-btn" class="bg-white/10 hover:bg-white/20 text-white/80 px-2 py-1 rounded text-[10px] border border-white/10 transition-colors flex items-center gap-1">
          <i class="fa-solid fa-times"></i> Clear
        </button>
      </div>
    </div>
  </main>

  <footer class="flex-shrink-0 h-7 bg-[#0d1a1f] text-cyan-100/70 shadow-[0_-2px_10px_rgba(1,74,96,0.5)] flex items-center justify-between z-20 border-t border-[#1a3a42] px-2">
    <div class="flex items-center gap-3">
      <span class="flex items-center gap-1 mr-1 border-r border-cyan-800/30 pr-2"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> <span class="text-[8px] text-cyan-200/70 hidden sm:inline">Live</span></span>
      <a href="license.html" class="hover:text-white transition-colors text-[8px]"><i class="fa-regular fa-circle-question mr-0.5 text-[8px]"></i> License</a>
      <a href="docs.html" class="hover:text-white transition-colors text-[8px]"><i class="fa-regular fa-lock mr-0.5 text-[8px] ml-[3px]"></i> Documentation</a>
      <span class="text-white/20 text-[8px]">© 2026</span>
    </div>
    <div id="footer-clock" class="font-mono text-[8px] text-cyan-200/80 tracking-wide select-none flex items-center">
      <span id="clock-day" class="font-sans opacity-70 mr-1">Wed,</span>
      <span id="clock-hours">02</span>
      <span id="clock-colon" class="clock-colon">:</span>
      <span id="clock-minutes">35</span>
      <span id="clock-ampm" class="ml-0.5">PM</span>
    </div>
  </footer>

  <script>
    (function() {
      'use strict';

      const input = document.getElementById('input-code');
      const output = document.getElementById('output-code');
      const obfuscateBtn = document.getElementById('obfuscate-btn');
      const clearBtn = document.getElementById('clear-btn');
      const copyBtn = document.getElementById('copy-output');
      const downloadBtn = document.getElementById('download-output');
      const uploadBtn = document.getElementById('upload-btn');
      const fileInput = document.getElementById('file-input');
      const inputLines = document.getElementById('input-lines');
      const inputFilename = document.getElementById('input-filename');
      const outputSize = document.getElementById('output-size');

      const optRename = document.getElementById('opt-rename');
      const optEncodeStrings = document.getElementById('opt-encode-strings');
      const optControlFlow = document.getElementById('opt-control-flow');
      const optDeadCode = document.getElementById('opt-dead-code');

      // ---- Create Web Worker using the bundled obfuscator ----
      let worker = null;

      function getWorker() {
        if (worker) return worker;
        try {
          // The worker script is the bundled file from GitHub
          worker = new Worker('JavaScriptObfuscator.js');
          worker.onerror = function(err) {
            output.value = '// Worker error: ' + err.message;
          };
          return worker;
        } catch (err) {
          output.value = '// Failed to create worker: ' + err.message;
          return null;
        }
      }

      function obfuscateWithWorker(code, options) {
        return new Promise((resolve, reject) => {
          const w = getWorker();
          if (!w) {
            reject(new Error('Worker not available.'));
            return;
          }
          // The worker expects the code as a string and possibly options.
          // The bundled worker from the GitHub repo expects the code as the message.
          // We'll send the code as a plain string (the worker handles the rest).
          w.onmessage = function(e) {
            // The worker returns the obfuscated code directly.
            const result = e.data;
            resolve(result);
          };
          w.onerror = function(err) {
            reject(err);
          };
          w.postMessage(code);
        });
      }

      async function obfuscate() {
        const code = input.value;
        if (!code.trim()) {
          output.value = '// No code to obfuscate.';
          updateOutputSize();
          return;
        }

        obfuscateBtn.disabled = true;
        obfuscateBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Obfuscating...';
        output.value = '// Processing...';

        try {
          // The bundled worker doesn't accept options; it uses its own defaults.
          // If you need options, you'd have to modify the worker file.
          const result = await obfuscateWithWorker(code);
          output.value = result;
        } catch (err) {
          output.value = '// Error during obfuscation:\n// ' + err.message;
        } finally {
          obfuscateBtn.disabled = false;
          obfuscateBtn.innerHTML = '<i class="fa-solid fa-bolt"></i> Obfuscate';
          updateOutputSize();
        }
      }

      // ---- File upload ----
      uploadBtn.addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            input.value = ev.target.result;
            inputFilename.textContent = file.name;
            updateLineCount();
            obfuscate();
          } catch (err) {
            output.value = '// Error reading file: ' + err.message;
          }
        };
        reader.readAsText(file);
        fileInput.value = '';
      });

      function updateLineCount() {
        const lines = input.value.split('\n').length;
        inputLines.textContent = lines + ' lines';
      }
      input.addEventListener('input', updateLineCount);
      updateLineCount();

      function updateOutputSize() {
        const bytes = new Blob([output.value]).size;
        if (bytes < 1024) outputSize.textContent = bytes + ' B';
        else if (bytes < 1048576) outputSize.textContent = (bytes / 1024).toFixed(1) + ' KB';
        else outputSize.textContent = (bytes / 1048576).toFixed(1) + ' MB';
      }
      output.addEventListener('input', updateOutputSize);
      updateOutputSize();

      clearBtn.addEventListener('click', () => {
        input.value = '';
        output.value = '';
        inputFilename.textContent = '';
        updateLineCount();
        updateOutputSize();
        input.focus();
      });

      copyBtn.addEventListener('click', async () => {
        if (!output.value) return;
        try {
          await navigator.clipboard.writeText(output.value);
          const original = copyBtn.innerHTML;
          copyBtn.innerHTML = '<i class="fa-regular fa-check mr-0.5"></i> Copied!';
          setTimeout(() => { copyBtn.innerHTML = original; }, 2000);
        } catch {
          output.select();
          document.execCommand('copy');
        }
      });

      downloadBtn.addEventListener('click', () => {
        if (!output.value) return;
        let baseName = inputFilename.textContent.replace(/\.[^.]+$/, '') || 'obfuscated';
        const blob = new Blob([output.value], { type: 'text/javascript' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = baseName + '_obfuscated.js';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        const original = downloadBtn.innerHTML;
        downloadBtn.innerHTML = '<i class="fa-solid fa-check mr-0.5"></i> Downloaded!';
        setTimeout(() => { downloadBtn.innerHTML = original; }, 2000);
      });

      // ---- Auto-obfuscate on option change ----
      // Note: option changes won't affect the bundled worker (no options support).
      // If you need options, you'll have to modify the worker file.
      // We'll keep the checkboxes but they won't do anything with this worker.
      // Alternatively, you can use the other worker approach with importScripts.
      // For now, we'll just keep them for UI consistency.

      input.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter') {
          e.preventDefault();
          obfuscate();
        }
      });

      // ---- Initial sample ----
      input.value = `// Welcome to the JS Obfuscator
function greet(name) {
  const message = 'Hello, ' + name + '!';
  console.log(message);
}
greet('World');`;
      updateLineCount();
      obfuscate();

      obfuscateBtn.addEventListener('click', obfuscate);

      window.addEventListener('beforeunload', function() {
        if (worker) {
          worker.terminate();
          worker = null;
        }
      });

    })();
  </script>
</body>
</html>
